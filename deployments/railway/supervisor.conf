[supervisord]
user = root
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0

[program:migrator]
directory = /app/backend
command = sh -c "./bin/docker-entrypoint-migrator.sh"
autostart = true
autorestart = unexpected
priority = 10
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:space]
directory = /app/space/apps/space
command = sh -c "./node_modules/.bin/react-router-serve ./build/server/index.js"
autostart = true
autorestart = true
environment = PORT=3002,HOSTNAME=0.0.0.0
priority = 15
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:api]
directory = /app/backend
command = sh -c "./bin/docker-entrypoint-api.sh"
autostart = true
autorestart = true
environment = PORT=3004,HOSTNAME=0.0.0.0
priority = 15
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:worker]
directory = /app/backend
command = sh -c "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency=2"
autostart = true
autorestart = true
priority = 20
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:beat]
directory = /app/backend
command = sh -c "./bin/docker-entrypoint-beat.sh"
autostart = true
autorestart = true
priority = 20
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:live]
command = sh -c "node /app/live/apps/live"
autostart = true
autorestart = true
environment = PORT=3005,HOSTNAME=0.0.0.0
priority = 20
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0

[program:proxy]
directory = /app/proxy
command = sh -c "caddy run --config /app/proxy/Caddyfile"
autostart = true
autorestart = true
priority = 20
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
